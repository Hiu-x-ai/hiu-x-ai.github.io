<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#0b0f19" rx="40"/>
  <circle cx="200" cy="200" r="180" fill="url(#bgGlow)"/>

  <!-- Orbital Rings -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- Central Core Hexagon / Robot -->
  <polygon points="200,120 270,160 270,240 200,280 130,240 130,160" fill="rgba(15, 23, 42, 0.85)" stroke="url(#cyberGrad)" stroke-width="4"/>

  <!-- Eyes / Core Sensor -->
  <circle cx="175" cy="190" r="14" fill="#00f0ff"/>
  <circle cx="225" cy="190" r="14" fill="#00f0ff"/>
  <circle cx="175" cy="190" r="6" fill="#ffffff"/>
  <circle cx="225" cy="190" r="6" fill="#ffffff"/>

  <!-- Mouth / Frequency display -->
  <line x1="160" y1="230" x2="240" y2="230" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="238" x2="220" y2="238" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Antennas -->
  <line x1="200" y1="120" x2="200" y2="85" stroke="#00f0ff" stroke-width="3"/>
  <circle cx="200" cy="80" r="7" fill="#00f0ff"/>
</svg>
